  '328':
    severity: error
    message: Fejl i indeholdt udbytteskat
    correction: 'For danske papirer: Undersøg udbytteskattebeløbet. Felt 45 skal være udfyldt med udbytteskattebeløbet, når der er tale om investeringsinstitut art 1, A og 1,B samt 8, A, B eller O bortset fra depotkode REV, FRI, BOP og KAP. (AMD, EAK og DIF for kalenderåret 2026)


      For udenlandske papirer: Undersøg udbytteskattebeløbet. Ved indberetning af et udenlandsk papir skal det faktiske indeholdte udbytteskattebeløb indberettes, såfremt denne er 0 (nul), skal felt 45 indberettes med 0 (nul). (Feltet må ikke være blankt).


      For yderligere vejledning se beskrivelsen til felt 45 i denne vejledning.'
  '329':
    severity: error
    message: Depotkode kræver se-nr.
    correction: Ingen uddybende beskrivelse.
  '330':
    severity: error
    message: Fejl i kode særlig tilladelse
    correction: Ingen uddybende beskrivelse.
  '334':
    severity: error
    message: Nettoudbytte > årlig udbytte
    correction: Ingen uddybende beskrivelse.
  '357':
    severity: error
    message: Depotkode ASK kræver udbytpct 0
    correction: Udbytteskatteprocenten skal indberettes med "00000"
  '358':
    severity: error
    message: Depotkode ASK kræver ejrst 0/1
    correction: ASK kræver indberetning på en person og kun ejerstatuskode 0 eller 1.
  '360':
