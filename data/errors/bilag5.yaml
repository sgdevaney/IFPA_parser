    correction: Undersøg om ejerstatuskode er korrekt. Er den det, skal depotregistreringen oplyses med koden KAP. Samtidig skal felt 28 være oplyst med kode 1.
  '311':
    severity: error
    message: Antal styk/nominel mangler
