  '289':
    severity: error
    message: SENR ophørt før indkomstår
    correction: Indberetningen forsøges foretaget for et se-nr., som er ophørt før kalenderåret for indberetningen. Investors cvr-nr. eller se-nr. fremkommer med en ophørsdato, som ligger før det kalenderår der indberettes om. Undersøg kunderegistreringen, ret denne, og foretag derefter en ny indberetning på de korrekte identifikationsoplysninger.
