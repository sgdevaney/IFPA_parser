    message: Indeh.udbskat ej for depotkod
    correction: Udbytteskattebeløb over 0 må ikke indberettes på depotkode ASK.
  '364':
    severity: error
    message: Papiret kan ikke indgå i ASK
    correction: I ASK kan der alene indgå aktiebaserede investeringsbeviser.
  '365':
    severity: error
    message: Depotkod ASK inv.art ej 1,3,8
    correction: En aktiesparekonto kan ikke oprettes af en kontoførende forening - inv. art 2.
  '366':
    severity: error
    message: Depotkod kræver CPRNR
    correction: ASK kan kun oprettes til fysiske personer.
  '401':
    severity: error
    message: Indsendt data vedr. beholdning
    correction: Indberetningstype (felt 69) er udfyldt med kode 1 = udlodning/geninvestering. Der kan ikke indberettes om beholdning/kursværdi når indberetningstypen er udfyldt med kode 1.
  '402':
    severity: error
    message: Indsendt data vedr. udb/geninv
    correction: Indberetningstype (felt 69) er udfyldt med kode 2 = beholdning. Der kan ikke indberettes om udbytte/udlodning/geninvestering når indberetningstypen er udfyldt med kode 2.
  '403':
    severity: error
    message: Beløb vedr. beholdning mangler
    correction: Indberetningstype (felt 69) er udfyldt med kode 2 = beholdning. Der mangler at blive udfyldt et beløb eller som minimum et "0" i felterne "Kursværdi" felt 47 og "indestående/nominel værdi" felt 48.
  '404':
    severity: error
    message: Data vedr. udb/geninv mangler
    correction: Indberetningstype (felt 69) er udfyldt med kode 1 = udlodning/geninvestering. Der mangler at blive udfyldt beløb eller som minimum et 0 (nul) i beløbsfelterne vedrørende udbytte. Følgende felter skal ligeledes være udfyldt "udlodders se.nr.", "udbytteskatteprocenten", "vedtagelsesdato" samt "udlodningskode".
  '405':
    severity: error
    message: Kapitalindk. ikke for art/virke
    correction: Ved indberetning af 1A, 8A, 3A, 3B og 3O i henholdsvis art og virke for investeringsinstitut, skal felt 37 udlodning/tilskrivning der er kapitalindkomst (KAPINDKUDLBLB) og felt 39 frivillig kapitalindkomst (FRIUDLKAPINDBLB) udfyldes med "0" (nul).
  '406':
    severity: error
    message: Aktieindk. ikke for art/virke
    correction: Ved indberetning af 1O, 1B, 8B og 8O i henholdsvis art og virke for investeringsinstitut, skal felt 35 dansk udbytte før indeholdt udbytteskat (DKUDBIEHSKATBLB), felt 41 øvrig aktieindkomst uden træk af udbytteskat (UDLOEVAKTINDKBLB) og felt 40 frivillig aktieindkomst (FRIUDLAKTINDKBLB) udfyldes med "0"(nul).
  '407':
    severity: error
    message: Ret ejerstatus eller ejerandel
    correction: I har udfyldt ejerandel, som I kun skal anvende når I indberetter om mere end 2 ejere, men ejerstatuskoden er ikke udfyldt med enten F eller V. Undersøg for korrekt ejerstatuskode eller korrekt ejerandel.
  '408':
    severity: error
    message: Fejl i ejerandel
    correction: I har udfyldt ejerstatuskode med F eller V, men ejerandel er udfyldt forkert fx med bogstaver, tegn mv.
  '409':
    severity: error
    message: Ejerandel mgl. for ejerstatus
    correction: I har udfyldt ejerstatuskode med F eller V, men ejerandel er udfyldt med blank eller 000000 (seks nuller). Når I anvender ejerstatus F og V (mere end 2 ejere) skal I indberette om kundens ejerandel.
  '410':
    severity: error
    message: Rente/kapitalejerkode mangler
    correction: I mangler at udfylde rente/kapitalejerkode med enten R eller K.
  '411':
    severity: error
    message: Rente/kapitalejerkode ej blank
    correction: Ingen uddybende beskrivelse.
  '412':
    severity: error
    message: Fejl i rente/kapitalejerkode
    correction: Rente/kapitalejerkode er ikke udfyldt med R eller K.
  '414':
    severity: error
    message: Fejl i depotkode for cpr-nr.
    correction: Indberetningen er afvist fordi I indberetter om et kalenderår efter det år, hvor investor er fyldt 21. I kan kun anvende depotkode BOP indtil udgangen af det kalenderår, hvor børneopsparingsordningen udløber.
  '415':
    severity: error
    message: Ejrst 8 kun depotkode KAP og BOP
    correction: Undersøg om ejerstatuskode er korrekt. Er den det, skal depotregistreringen oplyses med koden KAP eller BOP. Samtidig skal felt 28 være oplyst med kode 1.
  '416':
    severity: error
    message: Skatbgustord ejr. ej 1/5/8/U/V
    correction: Ingen uddybende beskrivelse.
  '599':
    severity: ok
    message: Ingen fejl
    correction: Kvittering for godkendt indberetning.
  '801':
    severity: advisory
    message: SENR ophører i indkomståret.
  '802':
    severity: advisory
    message: 'Advis for frikort og revisorerklæring. Der er indberettet med depotkode REV eller FRI på en person. Vi opfordrer jer til at gennemgå depotregistreringen for at sikre, at depoterne er korrekt klassificeret.


      For løbende indberetning for 2026 udgår depotkode REV og den erstattes af depotkode AMD, EAK og DIF.'
  '803':
    severity: advisory
    message: 'Der er indberettet Tintypekode 3: Kunderegistreringen er mangelfuld og opfylder derfor ikke kravene til indberetningspligten. Oplysningerne skal fortsat forsøges indhentet.'
